name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  switch:
    name: melonDS Switch (.nro)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y cmake ninja-build
          dkp-pacman -S --noconfirm switch-curl
      - name: Configure and build
        run: |
          mkdir -p switch/build && cd switch/build
          cmake .. -G Ninja -DENABLE_OGLRENDERER=OFF -DBUILD_QT_SDL=OFF \
            -DCMAKE_TOOLCHAIN_FILE=../cmake/Toolchain-cross-Switch.cmake -DCMAKE_BUILD_TYPE=Release
          ninja
      - uses: actions/upload-artifact@v4
        with:
          name: melonDS-switch-nro
          path: switch/build/melonDS.nro

  android-tv:
    name: melonDS TV (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Build debug APK
        working-directory: android-tv
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: melonDS-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Attach binaries to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [switch, android-tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename artifacts
        run: |
          mv dist/melonDS-switch-nro/melonDS.nro dist/melonDS-switch-${GITHUB_REF_NAME}.nro
          mv dist/melonDS-tv-apk/app-debug.apk dist/melonDS-tv-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/melonDS-switch-*.nro
            dist/melonDS-tv-*.apk
          generate_release_notes: true
